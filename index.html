<!doctype html>
<html lang="en">
  <head>
    <!-- ========================================================= -->
    <!-- BASIC META                                                -->
    <!-- ========================================================= -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>
      Athlytics | All-in-One Coaching & Athlete Management Platform
    </title>

    <meta
      name="description"
      content="Athlytics is a web-based coaching and athlete management platform built for sports programs. Manage attendance, schedules, training plans, rosters, communication, and program data in one clean, coach-first dashboard. Coaching is for the field, not the office."
    />

    <meta
      name="keywords"
      content="Athlytics, athlete management software, coaching platform, sports management system, high school athletics software, track and field management, cross country coaching tools, team attendance app, training plan software, sports SaaS, coaching dashboard"
    />

    <meta name="author" content="Athlytics LLC" />
    <meta name="application-name" content="Athlytics" />
    <meta name="theme-color" content="#0f172a" />

    <!-- ========================================================= -->
    <!-- BRAND / IDENTITY                                          -->
    <!-- ========================================================= -->
    <link rel="icon" href="/athlyticsfav.png" type="image/png" />
    <link rel="apple-touch-icon" href="/athlyticsfav.png" />

    <!-- ========================================================= -->
    <!-- OPEN GRAPH (FACEBOOK / LINK PREVIEWS)                     -->
    <!-- ========================================================= -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Athlytics" />
    <meta property="og:url" content="https://athlyticshq.com" />

    <meta
      property="og:title"
      content="Athlytics — Coaching & Athlete Management Made Simple"
    />

    <meta
      property="og:description"
      content="Athlytics helps coaches manage attendance, schedules, training, and program operations in one web-based platform. Designed for real coach workflows so you can focus on athletes, not admin."
    />

    <meta property="og:image" content="/athlytics-social-preview.png" />
    <meta property="og:image:alt" content="Athlytics coaching dashboard preview" />

    <!-- ========================================================= -->
    <!-- TWITTER / X                                               -->
    <!-- ========================================================= -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Athlytics | Coaching Is for the Field" />
    <meta
      name="twitter:description"
      content="An all-in-one athlete and program management platform built for coaches. Replace spreadsheets, group chats, and paperwork with one clean system."
    />
    <meta name="twitter:image" content="/athlytics-social-preview.png" />

    <!-- ========================================================= -->
    <!-- SEO / DISCOVERY                                           -->
    <!-- ========================================================= -->
    <link rel="canonical" href="https://athlyticshq.com" />

    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- ========================================================= -->
    <!-- STRUCTURED DATA (JSON-LD)                                 -->
    <!-- ========================================================= -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Athlytics",
        "operatingSystem": "Web",
        "applicationCategory": "SportsApplication",
        "description": "Athlytics is a web-based athlete and coaching management platform that centralizes attendance, scheduling, training, communication, and program operations for sports teams.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "publisher": {
          "@type": "Organization",
          "name": "Athlytics LLC",
          "url": "https://athlyticshq.com"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
