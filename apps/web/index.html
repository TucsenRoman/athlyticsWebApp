<!doctype html>
<html lang="en">
  <head>
    <!-- ========================================================= -->
    <!-- CORE META                                                 -->
    <!-- ========================================================= -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Athlytics | Coach-First Athlete & Program Management</title>

    <meta
      name="description"
      content="Athlytics is a coach-first web platform for managing attendance, schedules, training, and team data in one place. Built to replace spreadsheets and scattered tools—so coaches can focus on athletes, not admin."
    />

    <meta name="application-name" content="Athlytics" />
    <meta name="author" content="Athlytics LLC" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="robots" content="index, follow" />

    <!-- ========================================================= -->
    <!-- BRANDING                                                  -->
    <!-- ========================================================= -->
    <link rel="icon" href="/athlyticsfav.png" type="image/png" />
    <link rel="apple-touch-icon" href="/athlyticsfav.png" />

    <!-- ========================================================= -->
    <!-- CANONICAL                                                 -->
    <!-- ========================================================= -->
    <link rel="canonical" href="https://athlyticshq.com" />

    <!-- ========================================================= -->
    <!-- OPEN GRAPH (INSTAGRAM + GENERAL LINK PREVIEWS)            -->
    <!-- ========================================================= -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Athlytics" />
    <meta property="og:url" content="https://athlyticshq.com" />

    <meta
      property="og:title"
      content="Athlytics — Coaching Is for the Field, Not the Office"
    />

    <meta
      property="og:description"
      content="Coach-first software that centralizes schedules, attendance, training, and team data—so coaches spend less time managing and more time coaching."
    />

    <meta
      property="og:image"
      content="https://athlyticshq.com/athlytics-social-preview.png"
    />
    <meta
      property="og:image:alt"
      content="Athlytics dashboard preview showing coach-first athlete management tools"
    />

    <!-- ========================================================= -->
    <!-- X (TWITTER)                                               -->
    <!-- ========================================================= -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@athlytics" />

    <meta
      name="twitter:title"
      content="Athlytics | Coach-First Program Management"
    />

    <meta
      name="twitter:description"
      content="Replace spreadsheets, group chats, and paperwork with one clean system built for real coach workflows."
    />

    <meta
      name="twitter:image"
      content="https://athlyticshq.com/athlytics-social-preview.png"
    />

    <!-- ========================================================= -->
    <!-- STRUCTURED DATA (SEO + YOUTUBE DISCOVERY)                 -->
    <!-- ========================================================= -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Athlytics",
        "applicationCategory": "SportsApplication",
        "operatingSystem": "Web",
        "description": "Athlytics is a coach-first web application that centralizes attendance, scheduling, training, and program management for athletic teams.",
        "publisher": {
          "@type": "Organization",
          "name": "Athlytics LLC",
          "url": "https://athlyticshq.com"
        },
        "url": "https://athlyticshq.com"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <div id="overlay-root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
